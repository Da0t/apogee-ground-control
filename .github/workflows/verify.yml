name: Verify ground control
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Unit and PostgreSQL integration tests
        run: ./mvnw -B verify
      - name: Build operator console and application
        run: ./scripts/build.sh
      - name: Start demo services
        run: |
          ./scripts/compose.sh up -d --wait database
          java -jar target/apogee-0.1.0.jar --simulator > simulator.log 2>&1 &
          java -jar target/apogee-0.1.0.jar > ground.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8081/api/state | python3 -c 'import json,sys; s=json.load(sys.stdin); sys.exit(0 if s["fresh"] else 1)' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat ground.log
          exit 1
      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports
            web/test-results
            ground.log
            simulator.log

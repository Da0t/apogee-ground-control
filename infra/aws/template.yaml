AWSTemplateFormatVersion: '2010-09-09'
Description: Apogee optional private RDS deployment with an SSM-accessible Java host. Creates billable resources.
Parameters:
  HostInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  DatabaseInstanceType:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]
  DatabaseEngineVersion:
    Type: String
    Default: '17'
    AllowedPattern: '17(\.[0-9]+)?'
    Description: PostgreSQL 17 version available in the chosen region; verify before deployment.
  LatestAmazonLinux:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Network
      InternetGatewayId: !Ref InternetGateway
  HostSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  HostRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref HostSubnet
      RouteTableId: !Ref PublicRoutes
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Network
  DatabaseRoutesA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetA
      RouteTableId: !Ref PrivateRoutes
  DatabaseRoutesB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetB
      RouteTableId: !Ref PrivateRoutes
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound connections; outbound HTTPS for AWS APIs and packages.
      VpcId: !Ref Network
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accessible only from the Apogee host.
      VpcId: !Ref Network
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref HostSecurityGroup
  HostDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref HostSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets in two availability zones.
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
  DatabaseParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Require encrypted database connections.
      Family: postgres17
      Parameters:
        rds.force_ssl: '1'
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      DBInstanceClass: !Ref DatabaseInstanceType
      DBName: apogee
      MasterUsername: apogee_admin
      ManageMasterUserPassword: true
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: false
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      DBParameterGroupName: !Ref DatabaseParameters
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Apogee application/migration credentials. Rotation requires coordinated database update.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"apogee_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  ArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub '${Artifacts.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ApogeeDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${Artifacts.Arn}/releases/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!GetAtt Database.MasterUserSecret.SecretArn, !Ref ApplicationSecret]
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  Host:
    Type: AWS::EC2::Instance
    DependsOn: [InternetRoute, HostRoutes]
    Properties:
      ImageId: !Ref LatestAmazonLinux
      InstanceType: !Ref HostInstanceType
      IamInstanceProfile: !Ref HostProfile
      SubnetId: !Ref HostSubnet
      SecurityGroupIds: [!Ref HostSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      CreditSpecification:
        CPUCredits: standard
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-apogee'
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y java-21-amazon-corretto-headless postgresql15 awscli-2
          systemctl enable --now amazon-ssm-agent
Outputs:
  HostInstanceId:
    Value: !Ref Host
  ArtifactBucket:
    Value: !Ref Artifacts
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  AdminSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  ApplicationSecretArn:
    Value: !Ref ApplicationSecret

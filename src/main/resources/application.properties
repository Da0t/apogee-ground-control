server.port=${PORT:8081}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/apogee}
spring.datasource.username=${DATABASE_USER:apogee}
spring.datasource.password=${DATABASE_PASSWORD:apogee-local}
spring.datasource.hikari.maximum-pool-size=5
spring.jackson.serialization.indent-output=false
spring.mvc.async.request-timeout=0
server.error.include-message=always
apogee.simulator.host=${SIMULATOR_HOST:127.0.0.1}
apogee.simulator.port=${SIMULATOR_PORT:7071}
